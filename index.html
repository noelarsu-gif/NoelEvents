<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NoelEvents Control</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="NoelEvents">
<meta name="theme-color" content="#0B0A08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:400;font-display:swap;src:url(./fonts/cormorant-garamond-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:400;font-display:swap;src:url(./fonts/cormorant-garamond-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:500;font-display:swap;src:url(./fonts/cormorant-garamond-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:500;font-display:swap;src:url(./fonts/cormorant-garamond-latin-500-italic.woff2) format("woff2")}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:400;font-display:swap;src:url(./fonts/playfair-display-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:500;font-display:swap;src:url(./fonts/playfair-display-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:300;font-display:swap;src:url(./fonts/montserrat-latin-300-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:400;font-display:swap;src:url(./fonts/montserrat-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:500;font-display:swap;src:url(./fonts/montserrat-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:700;font-display:swap;src:url(./fonts/montserrat-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:600;font-display:swap;src:url(./fonts/montserrat-latin-600-normal.woff2) format("woff2")}
</style>
<style>
/* Layout: una sola columna tipo app móvil (máx. 760px), barra de pestañas fija abajo, hojas que suben desde abajo. Look único oscuro de marca. */
:root{
  --bg:#0B0A08; --surface:#151310; --surface2:#1D1A16; --line:#2E2A22; --line2:#3A342A;
  --ink:#F3EEE4; --ink2:#D8D2C6; --muted:#9C958A; --dim:#6B655B;
  --gold:#C9A961; --gold2:#E2C88A; --goldInk:#1A140A;
  --ok:#9FC4A0; --okLine:#4E6B4F; --warn:#E8B27A; --warnLine:#7A5A36; --bad:#E08A7E; --badLine:#7A3E36; --info:#9DB7D6; --infoLine:#3E5670;
  --display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --num:"Playfair Display", Georgia, serif;
  --body:Montserrat, "Helvetica Neue", Arial, sans-serif;
  --spring:cubic-bezier(.34,1.45,.64,1); --ease:cubic-bezier(.22,.8,.24,1);
  color-scheme:dark;
}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Pulsación tipo iOS ---------- */
.tap{transition:transform .38s var(--spring),background-color .2s,opacity .2s;will-change:transform;user-select:none;-webkit-user-select:none}
.tap.pressed{transform:scale(.95);transition:transform .09s ease-out}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .7s var(--ease),transform .9s var(--ease)}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .s1{font-size:11px;letter-spacing:5px;text-transform:uppercase;color:var(--muted);opacity:0;transform:translateY(8px);animation:rise .9s var(--ease) .15s forwards}
#splash .s2{font-family:var(--display);font-size:clamp(46px,13vw,76px);line-height:1;font-weight:400;opacity:0;transform:translateY(14px);animation:rise 1s var(--ease) .35s forwards}
#splash .s2 i{color:var(--gold)}
#splash .bar{width:0;height:1px;background:var(--gold);animation:grow 1.1s var(--ease) .7s forwards}
#splash .s3{font-family:var(--display);font-style:italic;font-size:20px;color:var(--gold);opacity:0;animation:rise .8s var(--ease) 1s forwards;text-align:center;padding:0 24px}
#splash .s2{text-align:center;padding:0 16px;text-wrap:balance}
.hello{display:flex;flex-direction:column;gap:2px}
.hello .h1{font-family:var(--display);font-size:22px;line-height:1.2}
.hello .h1 i{color:var(--gold)}
.hello .h2{font-size:12px;color:var(--muted)}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes grow{to{width:120px}}

/* ---------- Estructura ---------- */
.app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
[hidden]{display:none!important}
/* ---------- Bloqueo con PIN / huella ---------- */
#lock{position:fixed;inset:0;z-index:98;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));transition:opacity .45s var(--ease),transform .55s var(--ease)}
#lock.out{opacity:0;transform:scale(1.06);pointer-events:none}
#lock .lt1{font-size:10.5px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-weight:600}
#lock .lt2{font-family:var(--display);font-size:32px;text-align:center;line-height:1.1}
#lock .lsub{font-size:12px;color:var(--muted);min-height:1.2em;text-align:center}
#lock .lsub.err{color:var(--bad)}
.dots{display:flex;gap:18px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gold);transition:background-color .2s,transform .3s var(--spring)}
.dots i.on{background:var(--gold);transform:scale(1.12)}
.dots.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px}
.pad button{width:76px;height:76px;border-radius:50%;border:1px solid var(--line2);font-family:var(--num);font-size:30px;color:var(--ink);display:flex;align-items:center;justify-content:center;background:var(--surface)}
.pad button.k0{background:transparent;border-color:transparent;font-family:var(--body);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.pad button svg{width:28px;height:28px}
.pad button:disabled{opacity:0}
#lock .lforgot{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;min-height:40px}
/* ---------- Catálogos ---------- */
.f .chip input[type="checkbox"]{width:18px;height:18px;min-height:0;padding:0;border:0;-webkit-appearance:auto;appearance:auto;flex-shrink:0;accent-color:var(--gold);margin:0}
.f .chip{min-height:40px;padding:0 12px;cursor:pointer;color:var(--muted)}
.f .chip:has(input:checked){border-color:var(--gold);color:var(--ink);background:rgba(201,169,97,.08)}
.cat-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.cat-lang{padding:4px 0 2px;gap:10px;flex-wrap:wrap}
.cat-web .cat-name::after{content:" ▶";font-size:.6em;color:var(--gold);vertical-align:.2em}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) 132px;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.cat-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.cat-name{font-family:var(--display);font-size:20px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-sub{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-btn{width:132px;min-height:42px}
/* ---------- Modo privado ---------- */
.m{display:inline-block;transition:filter .5s var(--ease),opacity .5s var(--ease)}
body.priv .m{filter:blur(8px);opacity:.75;user-select:none}
.chart svg,.bars .track,.bars .fill{transition:filter .5s var(--ease)}
body.priv .chart svg,body.priv .bars .track{filter:blur(7px)}
.eyebtn svg{width:22px;height:22px;overflow:visible}
.eyebtn .eo{transform-origin:12px 12px;transform:scaleY(1);opacity:1;transition:transform .55s var(--spring),opacity .3s var(--ease)}
.eyebtn .ec{opacity:0;transform-origin:12px 12px;transform:translateY(-1px);transition:opacity .25s var(--ease),transform .55s var(--spring)}
body.priv .eyebtn .eo{transform:scaleY(.06);opacity:0}
body.priv .eyebtn .ec{opacity:1;transform:none}
body.priv .eyebtn{color:var(--gold);border-color:rgba(201,169,97,.5)}
/* ---------- Acceso ---------- */
#login{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));overflow-y:auto;animation:viewIn .6s var(--ease)}
#login .box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
#login .or{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim)}
#login .or::before,#login .or::after{content:"";flex:1;height:1px;background:var(--line)}
#login .msg{font-size:12.5px;line-height:1.55;color:var(--ink2);min-height:1em}
#login .msg.err{color:var(--bad)}
#login .link{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;align-self:flex-start;min-height:36px}
.gbtn{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gbtn svg{width:18px;height:18px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bg) 70%,rgba(11,10,8,0));padding-block:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:10px;letter-spacing:3.5px;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--gold);font-weight:600}
.view{animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{margin:0;font-size:10.5px;letter-spacing:3.5px;text-transform:uppercase;color:var(--gold);font-weight:600}
h1.title{margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(38px,10vw,52px);line-height:1;text-wrap:balance}
h1.title i{color:var(--gold)}
h2.sec{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.stack{display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.label{font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--muted);font-weight:500}
.sub{font-size:11.5px;color:var(--muted)}
.hr{height:1px;background:var(--line)}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.kpi{padding:16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi:nth-child(odd){border-right:1px solid var(--line)}
.kpi:nth-child(n+3){border-top:1px solid var(--line)}
.kpi .v{font-family:var(--num);font-size:clamp(22px,6vw,28px);white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi.gold{background:var(--gold);color:var(--goldInk)}
.kpi.gold .label{color:#3A2F17;font-weight:600}
.kpi .s{font-size:10.5px;color:var(--muted)}
.kpi.gold .s{color:#4A3C1E}
@media (min-width:620px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kpi{border-right:1px solid var(--line)!important;border-top:0!important}.kpi:last-child{border-right:0!important}}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border:1px solid var(--line2);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:600;color:var(--ink);background:var(--surface);text-decoration:none}
.btn.primary{background:var(--gold);color:var(--goldInk);border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--badLine);background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:10px;letter-spacing:1.6px}
.btn svg{width:17px;height:17px;flex-shrink:0}
.btn.block{width:100%}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);color:var(--ink2)}
.iconbtn svg{width:19px;height:19px}
.add-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;background:var(--gold);color:var(--goldInk);text-align:left;width:100%}
.add-hero .t{font-family:var(--display);font-size:26px;line-height:1}
.add-hero .s{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:600;color:#4A3C1E;margin-top:6px}
.add-hero .plus{width:46px;height:46px;border:1px solid rgba(26,20,10,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ---------- Pills ---------- */
.pill{display:inline-flex;align-items:center;font-size:8.5px;letter-spacing:1.3px;text-transform:uppercase;padding:4px 8px;border:1px solid;white-space:nowrap;font-weight:600}
.pill.ok{color:var(--ok);border-color:var(--okLine)}
.pill.warn{color:var(--warn);border-color:var(--warnLine)}
.pill.bad{color:var(--bad);border-color:var(--badLine)}
.pill.info{color:var(--info);border-color:var(--infoLine)}
.pill.der{color:var(--muted);border-color:var(--line2)}
.tag{display:inline-flex;font-size:10px;padding:3px 8px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}

/* ---------- Listas de eventos ---------- */
.ev{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px 14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.ev .d{display:flex;flex-direction:column;align-items:center;justify-content:center;height:58px;border:1px solid var(--line2);position:relative}
.ev .d .n{font-family:var(--num);font-size:22px;line-height:1}
.ev .d .m{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-top:3px}
.ev .d .w{position:absolute;top:-1px;left:-1px;right:-1px;height:3px}
.ev .nm{font-family:var(--display);font-size:21px;line-height:1.1;font-weight:500;overflow-wrap:anywhere}
.ev .meta{font-size:11px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.ev .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ev .r .p{font-family:var(--num);font-size:15px;white-space:nowrap}
.ev .r .q{font-size:10px;color:var(--gold);white-space:nowrap}
.ev.dim{opacity:.62}
.month-h{display:flex;align-items:baseline;justify-content:space-between;padding-top:18px;padding-bottom:6px;border-bottom:1px solid var(--gold)}
.month-h .t{font-family:var(--display);font-size:24px;text-transform:capitalize}
.empty{padding:28px 18px;border:1px dashed var(--line2);text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6}
.empty b{display:block;font-family:var(--display);font-size:22px;color:var(--ink);font-weight:400;margin-bottom:4px}

/* ---------- Avisos ---------- */
.alerts{display:flex;flex-direction:column;border:1px solid var(--line2)}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px;padding:12px 14px 12px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.5;color:var(--ink2)}
.alert:last-child{border-bottom:0}
.alert .k{align-self:stretch}
.alert.bad .k{background:var(--bad)}.alert.warn .k{background:var(--warn)}.alert.info .k{background:var(--info)}
.alert b{color:var(--ink);font-weight:600}
.alert-m{padding:7px 14px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold);font-weight:600}
.alert-m span::first-letter{text-transform:uppercase}
.ev-m{margin-top:10px;padding:6px 12px;background:var(--surface2);border-left:2px solid var(--gold);font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold);font-weight:600}
.ev-m:first-child{margin-top:0}

/* ---------- Segmentos ---------- */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex-shrink:0;min-height:36px;padding:0 14px;border:1px solid var(--line2);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;min-height:44px;background:var(--surface);border:1px solid var(--line2);padding:0 14px}

/* ---------- Calendario ---------- */
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-h .t{font-family:var(--display);font-size:32px;text-transform:capitalize;line-height:1}
.cal-h .y{font-family:var(--num);color:var(--gold);font-size:18px;margin-left:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;touch-action:pan-y}
.cal .wd{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);text-align:center;padding:6px 0}
.cal .c{aspect-ratio:1/1.08;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;gap:5px;position:relative;min-width:0}
.cal .c.out{border-color:transparent;color:var(--dim)}
.cal .c.we{background:var(--surface)}
.cal .c.today .dn{color:var(--gold);font-weight:600}
.cal .c.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cal .c.blk{background:repeating-linear-gradient(135deg,rgba(201,169,97,.10) 0 4px,transparent 4px 9px)}
.cal .dn{font-family:var(--num);font-size:15px;line-height:1}
.cal .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;padding:0 3px}
.cal .dot{width:7px;height:7px;border-radius:50%}
.cal .bk{position:absolute;bottom:5px;font-size:8px;letter-spacing:1px;color:var(--gold);text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:10.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---------- Finanzas ---------- */
.chart{width:100%;border:1px solid var(--line);padding:14px 10px 6px;background:var(--surface)}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--body)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-size:8.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:500;padding:0 6px 8px;border-bottom:1px solid var(--gold)}
table.t th.n,table.t td.n{text-align:right}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td.n{font-family:var(--num);font-variant-numeric:tabular-nums}
table.t tr.hl td{background:rgba(201,169,97,.06)}
table.t tfoot td{border-bottom:0;border-top:1px solid var(--gold);font-weight:600}
.tscroll{overflow-x:auto}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .b{display:grid;grid-template-columns:110px minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:12px}
.bars .track{height:10px;background:var(--surface2)}

const eur = (x, dec) => { const d = dec ?? (Math.abs(x - Math.round(x)) < 1e-9 ? 0 : 2); return x.toLocaleString("es-ES", {minimumFractionDigits:d, maximumFractionDigits:d, useGrouping:"always"}) + " €"; };

/* ============ Cálculos ============ */
const total = e => (e.servicios||[]).reduce((a,s)=>a+num(s.precio),0) + num(e.desplazamiento);
const pagado = e => (e.pagos||[]).reduce((a,p)=>a+num(p.importe),0);
const pendiente = e => Math.max(0, total(e) - pagado(e));
const coste = e => { if (e.estado === "derivada") return 0; const c = e.costes||{}; return num(c.ayudante)+num(c.album)+num(c.impresion)+(c.otros||[]).reduce((a,o)=>a+num(o.importe),0); };
const comision = e => { const d = e.derivacion||{}; return d.tipo === "%" ? total(e)*num(d.comision)/100 : num(d.comision); };
function ingreso(e){
  if (e.estado === "propuesta") return 0;
  if (e.estado === "cancelada") return pagado(e);
  if (e.estado === "derivada") return comision(e);
  return total(e);
}
const yearOf = e => e.fecha ? +e.fecha.slice(0,4) : null;
const monthOf = e => e.fecha ? +e.fecha.slice(5,7) - 1 : null;
function nominasMes(m){ return (S.cfg.nominas||[]).reduce((a,n)=>{ let v = num(n.importe); if (+n.pagas === 14 && (m === 5 || m === 11)) v += (n.extra !== "" && n.extra != null ? num(n.extra) : num(n.importe)); return a+v; },0); }
const isOwn = e => e.estado === "reservada";
function senal(e){ if (e.estado === "propuesta") return ["info","Propuesta"]; if (e.estado === "derivada") return ["der","Derivada"]; if (e.estado === "cancelada") return ["bad","Cancelada"]; return pagado(e) > 0 ? ["ok","Señal cobrada"] : ["warn","Sin señal"]; }
function evColor(e){ if (e.color) return e.color; return { reservada: pagado(e)>0 ? "#9FC4A0" : "#E8B27A", propuesta:"#9DB7D6", derivada:"#6B655B", cancelada:"#E08A7E" }[e.estado] || "#C9A961"; }
const yearEvents = y => S.events.filter(e => yearOf(e) === y);
function years(){ const s = new Set(S.events.map(yearOf).filter(Boolean)); s.add(new Date().getFullYear()); s.add(new Date().getFullYear()+1); return [...s].sort(); }
function bloqueoDe(fecha){ if (!fecha) return null; const md = fecha.slice(5); return (S.cfg.bloqueos||[]).find(b => b.fecha === md || b.fecha === fecha) || null; }
function gastosDetalle(list){
  const g = {};
  const add = (k,v) => { if (v) g[k] = (g[k]||0) + v; };
  list.filter(e=>e.estado!=="derivada" && e.estado!=="propuesta").forEach(e => { const c = e.costes||{}; add("Ayudantes", num(c.ayudante)); add("Álbumes", num(c.album)); add("Impresión", num(c.impresion)); (c.otros||[]).forEach(o => add((o.concepto||"Otros").trim().replace(/^./,x=>x.toUpperCase()), num(o.importe))); });
  return Object.entries(g).sort((a,b)=>b[1]-a[1]);
}

/* ============ Avisos ============ */
// Cada aviso: [tipo, texto, fecha] para poder agruparlos por mes
function avisos(){
  const out = [];
  const today0 = todayIso();
  const act = S.events.filter(e => e.fecha && e.estado === "reservada" && e.fecha >= today0);
  const byDay = {};
  act.forEach(e => (byDay[e.fecha] = byDay[e.fecha] || []).push(e));
  const dia = f => { const d = parseD(f); return DIA[d.getDay()] + " " + d.getDate(); };
  Object.entries(byDay).forEach(([d,l]) => { if (l.length > 1) out.push(["bad", `<b>Solape el ${dia(d)}</b>: ${l.map(x=>esc(x.novios)).join(" y ")}. Decide cuál derivas.`, d]); });
  act.forEach(e => { const b = bloqueoDe(e.fecha); if (b) out.push(["warn", `<b>${esc(e.novios)}</b> (${dia(e.fecha)}) cae en día bloqueado: ${esc(b.motivo)}.`, e.fecha]); });
  act.forEach(e => {
    const diff = (parseD(e.fecha) - new Date())/864e5;
    if (diff <= 30 && pendiente(e) > 0) out.push(["warn", `<b>${esc(e.novios)}</b> (${dia(e.fecha)}) es en menos de un mes y faltan ${eur(pendiente(e))}.`, e.fecha]);
    else if (pagado(e) === 0) out.push(["warn", `<b>${esc(e.novios)}</b> (${dia(e.fecha)}) no ha pagado la señal.`, e.fecha]);
  });
  const months = new Set(act.map(e => e.fecha.slice(0,7)));
  months.forEach(ym => {
    const [y,m] = ym.split("-").map(Number); let libre = false;
    for (let d = 1; d <= 31; d++) { const dt = new Date(y, m-1, d); if (dt.getMonth() !== m-1) break; if (dt.getDay() !== 6) continue;
      const sat = iso(dt), sun = iso(new Date(y, m-1, d+1)), fri = iso(new Date(y, m-1, d-1));
      if (!byDay[sat] && !byDay[sun] && !byDay[fri]) { libre = true; break; } }
    if (!libre) out.push(["bad", `<b>Sin fin de semana libre</b> este mes.`, ym + "-00"]);
  });
  S.events.filter(e => e.fecha >= today0 && e.estado === "derivada" && !num((e.derivacion||{}).comision)).forEach(e => out.push(["info", `<b>${esc(e.novios)}</b> (${dia(e.fecha)}): falta fijar la comisión con ${esc((e.derivacion||{}).companero || "el compañero")}.`, e.fecha]));
  act.filter(e => (e.extras||[]).length).forEach(e => out.push(["info", `<b>${esc(e.novios)}</b> (${dia(e.fecha)}) tiene extras propuestos sin confirmar: ${(e.extras||[]).map(x=>esc(x.nombre)+" "+eur(num(x.precio))).join(", ")}.`, e.fecha]));
  const rank = { bad: 0, warn: 1, info: 2 };
  return out.sort((a,b) => a[2].localeCompare(b[2]) || rank[a[0]] - rank[b[0]]);
}
function groupByMonth(list){
  let html = "", cur = "";
  list.forEach(e => { const ym = (e.fecha||"").slice(0,7);
    if (ym !== cur) { cur = ym; const [y,m] = ym.split("-"); html += `<div class="ev-m"><span>${MES[+m-1]} ${y}</span></div>`; }
    html += evRow(e); });
  return html;
}
function avisosHTML(av){
  let html = "", cur = "";
  av.forEach(([k,t,f]) => { const ym = f.slice(0,7);
    if (ym !== cur) { cur = ym; const [y,m] = ym.split("-"); html += `<div class="alert-m"><span>${MES[+m-1]} ${y}</span></div>`; }
    html += `<div class="alert ${k}"><span class="k"></span><span>${t}</span></div>`; });
  return `<div class="alerts">${html}</div>`;
}

/* ============ Animación de cifras ============ */
function countUp(root){
  root.querySelectorAll("[data-count]").forEach(el => {
    const target = num(el.dataset.count), dec = +el.dataset.dec || 0, t0 = performance.now(), dur = 900;
    const out = el.querySelector(".m") || el;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { out.textContent = eur(target, dec); return; }
    const step = t => { const p = Math.min(1, (t - t0)/dur), k = 1 - Math.pow(1-p, 3); out.textContent = eur(target*k, dec); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
const cnt = (v, dec) => `<span data-count="${v}" data-dec="${dec ?? (Math.abs(v-Math.round(v))<1e-9?0:2)}">${eur(v, dec)}</span>`;

}

  if (anim) { window.scrollTo(0,0); countUp(main); } else if (keepScroll) window.scrollTo(0, y);

function defaultYear(){ const ys = S.events.map(yearOf).filter(Boolean); const cy = new Date().getFullYear(); return ys.some(y => y > cy) && !ys.includes(cy) ? Math.min(...ys.filter(y=>y>cy)) : (ys.length ? (ys.includes(cy) ? cy : Math.max(...ys)) : cy); }
function yearSel(){ return `<div class="seg" role="tablist" aria-label="Año">${years().map(y => `<button class="tap ${y===S.year?"on":""}" data-act="year" data-v="${y}" role="tab" aria-selected="${y===S.year}">${y}</button>`).join("")}</div>`; }

function evRow(e){
  const d = parseD(e.fecha); const [k,t] = senal(e);
  const servs = (e.servicios||[]).map(s=>s.nombre).filter(Boolean).join(" · ");
  const right = e.estado === "derivada" ? `<span class="p num">${eur(comision(e))}</span><span class="q">comisión</span>` : `<span class="p num">${eur(total(e))}</span>${pendiente(e)>0 && e.estado==="reservada" ? `<span class="q">faltan ${eur(pendiente(e))}</span>` : ""}`;
  return `<button class="ev tap ${e.estado==="derivada"||e.estado==="cancelada"?"dim":""}" data-act="open" data-id="${e.id}">
    <span class="d"><span class="w" style="background:${evColor(e)}"></span><span class="n">${d?d.getDate():"–"}</span><span class="m">${d?DIA[d.getDay()]:""}</span></span>
    <span style="min-width:0"><span class="nm" style="display:block">${esc(e.novios || "Sin nombre")}</span><span class="meta" style="display:block">${esc(e.lugar||"")}${servs ? " · " + esc(servs) : ""}</span></span>
    <span class="r">${right}<span class="pill ${k}">${t}</span></span></button>`;
}

/* ---------- Inicio ---------- */
function vInicio(){
  const Y = S.year, list = yearEvents(Y), own = list.filter(isOwn);
  const fact = own.reduce((a,e)=>a+total(e),0), cob = own.reduce((a,e)=>a+pagado(e),0), pen = own.reduce((a,e)=>a+pendiente(e),0);
  const neto = list.reduce((a,e)=>a+ingreso(e)-coste(e),0);
  let nom = 0; for (let m=0;m<12;m++) nom += nominasMes(m);

/* ---------- Calendario ---------- */
function vCal(){
  if (!S.calM) { const first = S.events.filter(e=>e.fecha>=todayIso()).sort((a,b)=>a.fecha.localeCompare(b.fecha))[0]; const d = first ? parseD(first.fecha) : new Date(); S.calM = new Date(d.getFullYear(), d.getMonth(), 1); }
  const y = S.calM.getFullYear(), m = S.calM.getMonth();
  const start = new Date(y, m, 1 - ((new Date(y,m,1).getDay()+6)%7));
  const byDay = {}; S.events.forEach(e => { if (e.fecha) (byDay[e.fecha] = byDay[e.fecha]||[]).push(e); });
  let cells = "";
  for (let i=0;i<42;i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i), k = iso(d), out = d.getMonth() !== m;
    if (i >= 35 && out) break;
    const evs = byDay[k]||[], b = bloqueoDe(k), we = d.getDay()===0||d.getDay()===6;
    cells += `<button class="c tap ${out?"out":""} ${we?"we":""} ${k===todayIso()?"today":""} ${k===S.calSel?"sel":""} ${b?"blk":""}" data-act="day" data-v="${k}" aria-label="${fmtLong(k)}${evs.length?", "+evs.length+" evento"+(evs.length>1?"s":""):""}${b?", bloqueado: "+esc(b.motivo):""}">
      <span class="dn">${d.getDate()}</span><span class="dots">${evs.map(e=>`<span class="dot" style="background:${evColor(e)}"></span>`).join("")}</span>${b?`<span class="bk">♥</span>`:""}</button>`;
  }
  const selEv = S.calSel ? (byDay[S.calSel]||[]) : S.events.filter(e=>e.fecha && e.fecha.slice(0,7) === `${y}-${pad(m+1)}`).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const selB = S.calSel && bloqueoDe(S.calSel);
  return `
  <div><p class="eyebrow">Calendario</p></div>
  <div class="cal-h"><button class="iconbtn tap" data-act="mprev" aria-label="Mes anterior">${I.left}</button>
    <div style="text-align:center"><span class="t">${MES[m]}</span><span class="y">${y}</span></div>
    <button class="iconbtn tap" data-act="mnext" aria-label="Mes siguiente">${I.right}</button></div>
  <div><div class="cal" id="calGrid">${["L","M","X","J","V","S","D"].map(x=>`<div class="wd">${x}</div>`).join("")}${cells}</div></div>
  <div class="legend"><span><i style="background:#9FC4A0"></i>Con señal</span><span><i style="background:#E8B27A"></i>Sin señal</span><span><i style="background:#9DB7D6"></i>Propuesta</span><span><i style="background:#6B655B"></i>Derivada</span><span><i style="background:transparent;border:1px solid var(--gold);border-radius:0"></i>Día bloqueado</span></div>
  <div class="stack" style="gap:8px">
    <div class="between"><h2 class="sec">${S.calSel ? fmtLong(S.calSel).replace(/^./,c=>c.toUpperCase()) : "Este mes"}</h2>${S.calSel?`<button class="btn sm ghost tap" data-act="day" data-v="">Ver mes</button>`:""}</div>
    ${selB ? `<div class="alert warn" style="border:1px solid var(--line2)"><span class="k"></span><span><b>Bloqueado:</b> ${esc(selB.motivo)}</span></div>` : ""}
    ${selEv.length ? `<div>${selEv.map(evRow).join("")}</div>` : `<div class="empty"><b>Sin eventos</b>${S.calSel ? `<button class="btn sm primary tap" data-act="new" data-date="${S.calSel}" style="margin-top:10px">Añadir este día</button>` : "Este mes está libre."}</div>`}
  </div>
  <div class="panel"><span class="label" style="color:var(--gold);font-weight:600">Exportar al calendario del móvil</span>
    <p class="sub" style="margin:0;line-height:1.55">Genera un archivo .ics compatible con Calendario de iPhone y Google Calendar.</p>
    <div class="actions"><button class="btn tap" data-act="ics" data-v="month">${I.dl} Este mes</button><button class="btn tap" data-act="ics" data-v="year">${I.dl} Año ${y}</button></div></div>`;
}

/* ---------- Eventos ---------- */
function vEventos(){
  const f = S.filter, q = S.q.trim().toLowerCase();
  const today = todayIso(), past = S.when === "celebrados";
  let list = S.events.filter(e => past ? (e.fecha && e.fecha < today) : (!e.fecha || e.fecha >= today)).sort((a,b)=> past ? b.fecha.localeCompare(a.fecha) : (a.fecha||"9").localeCompare(b.fecha||"9"));
  const flt = { todas: ()=>true, senal: e=>e.estado==="reservada"&&pagado(e)>0, sinsenal: e=>e.estado==="reservada"&&pagado(e)===0, propuesta: e=>e.estado==="propuesta", derivada: e=>e.estado==="derivada", cancelada: e=>e.estado==="cancelada" };
  list = list.filter(flt[f] || flt.todas);
  if (q) list = list.filter(e => [e.novios,e.lugar,(e.etiquetas||[]).join(" "),(e.servicios||[]).map(s=>s.nombre).join(" ")].join(" ").toLowerCase().includes(q));
  const groups = {}; list.forEach(e => { const k = e.fecha ? e.fecha.slice(0,7) : "sin"; (groups[k]=groups[k]||[]).push(e); });
  const opts = [["todas","Todas"],["senal","Con señal"],["sinsenal","Sin señal"],["propuesta","Propuestas"],["derivada","Derivadas"],["cancelada","Canceladas"]];
  return `
  <div><p class="eyebrow">Reservas</p><h1 class="title">${past ? "Eventos <i>celebrados</i>" : "Próximos <i>eventos</i>"}</h1></div>
  <div class="seg" role="tablist" aria-label="Periodo"><button class="tap ${!past?"on":""}" data-act="when" data-v="proximos" role="tab" aria-selected="${!past}">Por realizar</button><button class="tap ${past?"on":""}" data-act="when" data-v="celebrados" role="tab" aria-selected="${past}">Celebrados</button></div>
  <input class="search" id="q" type="search" placeholder="Buscar novios, lugar, etiqueta…" value="${esc(S.q)}" aria-label="Buscar">
  <div class="seg">${opts.map(([k,t])=>`<button class="tap ${f===k?"on":""}" data-act="filter" data-v="${k}">${t}</button>`).join("")}</div>
  ${list.length ? Object.entries(groups).map(([k,l]) => { const [y,m] = k.split("-"); const sum = l.filter(isOwn).reduce((a,e)=>a+total(e),0);
    return `<div><div class="month-h"><span class="t">${k==="sin"?"Sin fecha":MES[+m-1]+" "+y}</span><span class="sub num">${l.length} · ${eur(sum)}</span></div>${l.map(evRow).join("")}</div>`; }).join("")
  : `<div class="empty"><b>${past ? "Sin eventos celebrados" : "Nada por realizar"}</b>${past ? "Aquí aparecerán los eventos cuando pase su fecha." : "Cambia el filtro o añade un evento nuevo."}</div>`}`;
}

/* ---------- Finanzas ---------- */
function vFin(){
  const Y = S.year, list = yearEvents(Y);
  const rows = [];
  for (let m=0;m<12;m++){ const le = list.filter(e=>monthOf(e)===m); const n = nominasMes(m), b = le.reduce((a,e)=>a+ingreso(e),0), g = le.reduce((a,e)=>a+coste(e),0); rows.push({m,n,b,g,c:le.filter(e=>e.estado!=="propuesta"&&e.estado!=="cancelada").length}); }
  const tn = rows.reduce((a,r)=>a+r.n,0), tb = rows.reduce((a,r)=>a+r.b,0), tg = rows.reduce((a,r)=>a+r.g,0);
  const gd = gastosDetalle(list), gmax = Math.max(1, ...gd.map(x=>x[1]));
  const own = list.filter(isOwn); const cob = own.reduce((a,e)=>a+pagado(e),0);
  const nb = own.length;
  return `
  <div><p class="eyebrow">Finanzas</p><h1 class="title">Ingresos y <i>gastos</i></h1></div>
  ${yearSel()}
  <div class="kpis">
    <div class="kpi"><span class="label">Ingresos totales</span><span class="v">${cnt(tn+tb,2)}</span><span class="s">${hasNom() ? "Nóminas + eventos" : "Eventos del año"}</span></div>
    <div class="kpi"><span class="label">Gastos eventos</span><span class="v">${cnt(tg)}</span><span class="s">Ayudantes, material, extras</span></div>
    <div class="kpi"><span class="label">Media por evento</span><span class="v">${cnt(nb? own.reduce((a,e)=>a+total(e),0)/nb : 0,0)}</span><span class="s">${nb} evento${nb===1?"":"s"} propio${nb===1?"":"s"}</span></div>
    <div class="kpi gold"><span class="label">Neto ${Y}</span><span class="v">${cnt(tn+tb-tg,2)}</span><span class="s">${eur((tn+tb-tg)/12,0)} al mes de media</span></div>
  </div>
  <div class="stack" style="gap:10px"><h2 class="sec">Ingresos por mes</h2>${chartMonths(rows)}</div>
  <div class="stack" style="gap:10px"><h2 class="sec">Gastos por concepto</h2>
    ${gd.length ? `<div class="bars">${gd.map(([k,v])=>`<div class="b"><span style="overflow-wrap:anywhere">${esc(k)}</span><span class="track"><span class="fill" style="display:block;width:${v/gmax*100}%"></span></span><span class="v">${eur(v)}</span></div>`).join("")}</div>` : `<div class="empty"><b>Sin gastos este año</b>Se suman desde la ficha de cada evento.</div>`}
  </div>
  <div class="stack" style="gap:10px"><h2 class="sec">Detalle mensual</h2>
  <div class="tscroll"><table class="t"><thead><tr><th>Mes</th>${hasNom()?`<th class="n">Nóminas</th>`:""}<th class="n">Eventos</th><th class="n">Gastos</th><th class="n">Neto</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="${r.b?"hl":""}"><td style="text-transform:capitalize">${MES[r.m]}${r.c?` <span class="sub">· ${r.c}</span>`:""}</td>${hasNom()?`<td class="n">${eur(r.n,2)}</td>`:""}<td class="n">${r.b?eur(r.b):'<span style="color:var(--dim)">—</span>'}</td><td class="n">${r.g?"−"+eur(r.g):'<span style="color:var(--dim)">—</span>'}</td><td class="n" style="color:var(--ink)">${eur(r.n+r.b-r.g,2)}</td></tr>`).join("")}
  </tbody><tfoot><tr><td>Total</td>${hasNom()?`<td class="n">${eur(tn,2)}</td>`:""}<td class="n">${eur(tb)}</td><td class="n">−${eur(tg)}</td><td class="n" style="color:var(--gold)">${eur(tn+tb-tg,2)}</td></tr></tfoot></table></div>
  <p class="sub" style="margin:0;line-height:1.55">Cada evento cuenta en su mes de celebración. Los derivados suman solo tu comisión, y los propuestos no suman. Cobrado hasta hoy: ${eur(cob)}. No incluye impuestos.</p></div>`;
}
function chartMonths(rows){
  const W = 340, H = 210, L = 38, R = 6, T = 10, B = 26, iw = W-L-R, ih = H-T-B;
  const mx = Math.max(1, ...rows.map(r=>r.n+r.b));
  const step = mx > 6000 ? 2000 : mx > 3000 ? 1000 : 500; const top = Math.ceil(mx/step)*step;
  const y = v => T + ih - v/top*ih, bw = iw/12*0.62;
  let g = ""; for (let v=0; v<=top; v+=step){ g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#2E2A22" stroke-width="0.6"/><text x="${L-5}" y="${y(v)+3}" font-size="8" fill="#9C958A" text-anchor="end">${v>=1000?(v/1000)+"k":v}</text>`; }
  const bars = rows.map((r,i) => { const x = L + iw/12*i + (iw/12-bw)/2; const hn = r.n/top*ih, hb = r.b/top*ih;
    return `<g><title>${MES[i]}: nóminas ${eur(r.n,2)}, eventos ${eur(r.b)}</title><rect x="${x}" y="${T+ih-hn}" width="${bw}" height="${hn}" fill="#4A443A"><animate attributeName="height" from="0" to="${hn}" dur=".8s" calcMode="spline" keySplines=".22 .8 .24 1" keyTimes="0;1"/><animate attributeName="y" from="${T+ih}" to="${T+ih-hn}" dur=".8s" calcMode="spline" keySplines=".22 .8 .24 1" keyTimes="0;1"/></rect>${hb?`<rect x="${x}" y="${T+ih-hn-hb}" width="${bw}" height="${hb}" fill="#C9A961"><animate attributeName="opacity" from="0" to="1" dur="1s"/></rect>`:""}<text x="${x+bw/2}" y="${H-10}" font-size="8.5" fill="#9C958A" text-anchor="middle">${MES[i][0].toUpperCase()}</text></g>`; }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos mensuales: nóminas y eventos">${g}${bars}</svg>
  <div class="legend" style="padding:6px 4px 4px">${hasNom()?`<span><i style="background:#4A443A;border-radius:0"></i>Nóminas</span>`:""}<span><i style="background:#C9A961;border-radius:0"></i>Eventos</span></div></div>`;
}

function setPath(obj, path, val){ const k = path.split("."); let o = obj; for (let i=0;i<k.length-1;i++){ o = o[isNaN(k[i]) ? k[i] : +k[i]]; } o[isNaN(k.at(-1)) ? k.at(-1) : +k.at(-1)] = val; }

function buildIcs(list){
  const now = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//NoelEvents//Centro de control//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:NoelEvents"];
  list.filter(e=>e.fecha && e.estado!=="cancelada").forEach(e => {

    if (h.inicio || h.montaje) { const st = (h.montaje||h.inicio).replace(":","")+"00"; L.push(`DTSTART:${d}T${st}`); if (h.fin) { const en = h.fin.replace(":","")+"00"; const ed = en < st ? iso(new Date(parseD(e.fecha).getTime()+864e5)).replace(/-/g,"") : d; L.push(`DTEND:${ed}T${en}`); } else L.push("DURATION:PT9H"); }

    if (e.lugar) L.push(fold(`LOCATION:${icsEsc(e.lugar)}`));

}

async function saveFile(filename, data, okMsg, share){
  const ext = filename.split(".").pop().toLowerCase();
  const blob = data instanceof Blob ? data : new Blob([data], { type: (MIME[ext]||"text/plain") + ";charset=utf-8" });
  if (share && navigator.canShare) {
    const file = new File([blob], filename, { type: MIME[ext] || blob.type });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: filename.replace(/\.\w+$/,"") }); return true; }
      catch(err){ if (err && err.name === "AbortError") { toast("Cancelado"); return false; } }
    }
  }
  download(filename, blob); toast(okMsg || "Descargado"); return true;
}

async function makePdf(e, lang, cond){
  const btn = $("#mkpdfBtn"); if (btn) { btn.disabled = true; btn.innerHTML = "Generando…"; }
  try {
    if (!window.html2canvas || !window.jspdf) throw new Error("libs");
    const host = $("#pdfhost"); host.innerHTML = reservaHTML(e, lang, cond);
    await Promise.all(['400 30px "Cormorant Garamond"','italic 400 30px "Cormorant Garamond"','400 30px "Playfair Display"','500 30px "Playfair Display"','300 12px Montserrat','400 12px Montserrat','600 12px Montserrat'].map(f=>document.fonts.load(f).catch(()=>{})));
    await document.fonts.ready;
    await Promise.all([...host.querySelectorAll("img")].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
    // Foto entera si cabe; si la página se desborda, se reduce la altura y se recorta lo justo
    host.querySelectorAll(".pp").forEach(pg => { const im = pg.querySelector("img[data-pos]"); if (!im) return;
      pg.style.height = "auto"; const over = pg.scrollHeight - 1123; pg.style.height = "1123px";
      if (over > 0) { im.style.height = Math.max(220, im.offsetHeight - over - 6) + "px"; im.style.objectFit = "cover"; im.style.objectPosition = im.dataset.pos; } });
    // html2canvas ignora object-fit: recortamos cada foto a su hueco exacto antes de capturar
    await Promise.all([...host.querySelectorAll("img")].map(im => new Promise(r => {
      try {
        const w = im.offsetWidth, h = im.offsetHeight, iw = im.naturalWidth, ih = im.naturalHeight;
        if (!w || !h || !iw || !ih) return r();
        const py = parseFloat((getComputedStyle(im).objectPosition.split(" ")[1]) || "50") / 100;
        const scale = Math.max(w / iw, h / ih), sw = w / scale, sh = h / scale;
        const sx = (iw - sw) / 2, sy = Math.min(ih - sh, Math.max(0, (ih - sh) * (isNaN(py) ? .5 : py)));
        const cv = document.createElement("canvas"); cv.width = w * 2; cv.height = h * 2;
        cv.getContext("2d").drawImage(im, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
        im.onload = im.onerror = () => r(); im.style.objectFit = "fill"; im.src = cv.toDataURL("image/jpeg", 0.92);
      } catch(_) { r(); }
    })));
    const pdf = new window.jspdf.jsPDF({ unit:"pt", format:"a4", compress:true });
    const pages = [...host.querySelectorAll(".pp")];
    for (let i=0;i<pages.length;i++){
      const cv = await html2canvas(pages[i], { scale: 2, backgroundColor: "#0E0D0B", useCORS: true, logging: false, width: 794, height: 1123, windowWidth: 794 });
      if (i) pdf.addPage("a4");
      pdf.addImage(cv.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, 595.28, 841.89);
    }
    pdf.setProperties({ title: `Reserva ${e.novios}`, author: (S.cfg.contacto||{}).firma || "Noel DJ" });
    const blob = pdf.output("blob"); host.innerHTML = "";
    const fn = `${lang==="ca"?"Reserva":"Reserva"} ${e.novios} ${e.fecha}.pdf`.replace(/[\\/:*?"<>|]/g,"");
    await saveFile(fn, blob, "PDF descargado.", true);
  } catch(err){ console.log("[NoelEvents] pdf", err); toast("No se ha podido generar el PDF. Inténtalo otra vez."); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = I.pdf + " Generar y compartir"; } }
}

    E("d12", `${y}-10-02`, "Carla i Biel", "Celler del Molí", [["DJ + fotomatón", 950]], { pagos: [P(`${Y}-10-28`, 100)], tareas: [{ texto: "Confirmar horario con el celler", hecha: true }, { texto: "Reunión de canciones", hecha: false }] })
  ];
  const seed = Object.fromEntries(ev);
  seed["config/ajustes"] = { nominas: [], costes: { ayudante: 120, album: 15, impresion: 13 },
    catalogo: [{ nombre: "DJ", precio: 650 }, { nombre: "Fotomatón", precio: 350 }, { nombre: "Plataforma 360", precio: 450 }, { nombre: "Fuegos fríos", precio: 190 }, { nombre: "Humo de colores", precio: 490 }, { nombre: "Pack DJ + fotomatón", precio: 950 }, { nombre: "Pack DJ + 360", precio: 1050 }, { nombre: "Pack completo", precio: 1350 }],
    bloqueos: [{ fecha: "08-15", motivo: "Vacaciones en familia" }], companeros: ["Compañero"],
    contacto: { firma: "Tu nombre · Tu empresa", telefono: "600 000 000", instagram: "@tuempresa" }, horasExtra: { antelacion: 70, mismoDia: 100 } };
  return seed;
}
function startDemo(){
  S.demo = true; started = true; $("#login").hidden = true;
  document.querySelector(".brand").innerHTML = "<b>Tu empresa</b> · Demostración";
  S.db = MemDB(demoSeed());
  $("#splashName").innerHTML = `Bienvenido a la <i>demo</i>`;
  const sp = $("#splash"); sp.hidden = false; sp.classList.remove("out");
  setTimeout(() => sp.classList.add("out"), 1900); sp.addEventListener("click", () => sp.classList.add("out"));
  setTimeout(() => { sp.hidden = true; }, 2700);
  render(true); startData();
}
async function boot(){
  paintTabs();
  $("#splash").hidden = true;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
  bioAvailable().then(v => { S.bioOk = v; });
  if (location.hash === "#demo") { startDemo(); return; }
  try { const m = sessionStorage.getItem("ne_motivo"); if (m) { sessionStorage.removeItem("ne_motivo"); lMsg(m, true); } } catch(_){}
  window.addEventListener("hashchange", () => { if (location.hash === "#demo" && !started) startDemo(); });
  await setPersistence(auth, browserLocalPersistence).catch(()=>{});
  getRedirectResult(auth).catch(e => lMsg(aerr(e), true));
  onAuthStateChanged(auth, async user => {
    if (!user) { showLogin("main"); return; }
    S.me = await cuentaDe(user.email);
    if (!S.me) { await signOut(auth); showLogin("main"); lMsg(`${user.email} no tiene acceso a esta app.`, true); return; }
    if (!user.emailVerified) { $("#vEmail").textContent = user.email; showLogin("verify"); return; }
    $("#login").hidden = true;
    if (started) return; started = true;
    S.db = DB;
    const go = () => { splash(user); render(true); startData(); };
    if (LK.get()) showLock("unlock", go); else go();
    write(S.db.doc("usuarios/" + user.uid).set({ email: user.email.toLowerCase(), nombre: S.me.nombre, ultimoAcceso: new Date().toISOString() }), "registrar la cuenta");
  });
}
function startData(){
  S.db.collection("events").onSnapshot(snap => {
    S.events = snap.docs.map(d => ({ id: d.id, ...d.data() })); const first = !S.loaded; S.loaded = true;
    if (first) S.year = S.demo ? new Date().getFullYear() + 1 : defaultYear();
    if (first) setTimeout(openFromHash, 50);
    if (S.sheetMode === "edit" || S.sheetMode === "copy") { render(false); return; }
    if (S.sheetMode === "detail") { const e = S.events.find(x=>x.id===S.sheetId); if (e && !S.confirmDel && $("#pdfPanel")?.hidden !== false) $("#sheetBody").innerHTML = maskMoney(detailBody(e)); }
    render(first);
  }, err => { console.log("[NoelEvents] db", err); S.loaded = true; render(false); if (err && err.code === "permission-denied") wipeLocal("La sesión de este dispositivo se ha cerrado por seguridad. Vuelve a entrar."); });
  S.db.collection("usuarios").onSnapshot(snap => { S.users = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(a.nombre).localeCompare(String(b.nombre))); if (S.tab === "ajustes" && !(document.activeElement && document.activeElement.closest && document.activeElement.closest("#cfgForm"))) render(false); }, () => {});
  S.db.doc("config/catalogos").onSnapshot(snap => { if (snap.exists) { const c = snap.data(); if (c && Array.isArray(c.tarifas) && c.tarifas.length) { S.cats = c; if ((c.v || 1) < 3) { const m = clone(c); m.v = 3; if (!m.tarifas.some(t => t.id === "torrens")) m.tarifas.push(clone(TORRENS)); m.tarifas.forEach(t => { if (t.id === "torrens" && !t.marca) t.marca = "events"; }); S.cats = m; write(S.db.doc("config/catalogos").set(m), "actualizar los catálogos"); } } } if (S.tab === "inicio" && !S.sheetMode) render(false); }, () => {});
  S.db.doc("config/ajustes").onSnapshot(snap => {
    if (snap.exists) { const c = snap.data(); S.cfg = Object.assign(clone(DEFAULT_CFG), clone(c)); S.cfg.costes = Object.assign({}, DEFAULT_CFG.costes, c.costes||{}); S.cfg.contacto = Object.assign({}, DEFAULT_CFG.contacto, c.contacto||{}); S.cfg.horasExtra = Object.assign({}, DEFAULT_CFG.horasExtra, c.horasExtra||{});
      // Una sola vez: añadir "Humo de colores" a los servicios rápidos (si luego lo quitas, no vuelve)
      if (!c.humoAnadido && !S.demo) {
        const cat = (S.cfg.catalogo || []).slice();
        if (!cat.some(x => /humo|fum/i.test(x.nombre))) { const i = cat.findIndex(x => /fuego/i.test(x.nombre)); cat.splice(i >= 0 ? i + 1 : cat.length, 0, { nombre: "Humo de colores", precio: 490 }); }
        write(S.db.doc("config/ajustes").update({ catalogo: cat, humoAnadido: true }), "añadir el humo de colores");
        S.cfg.catalogo = cat;
      } }
    if (S.tab === "ajustes" && document.activeElement && document.activeElement.closest && document.activeElement.closest("#cfgForm")) return;
    if (S.sheetMode !== "edit") render(false);
  }, () => {});
}
window.addEventListener("online", () => started && render(false));
window.addEventListener("offline", () => started && render(false));
boot();
